name: Build MindLoop APK & PWA

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pwa:
    name: Build Offline PWA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: mindloop-pwa-dist
          path: web/dist

  build-android-apk:
    name: Build Android APK (minSdk 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Keep bundled lesson packs synced
        run: |
          mkdir -p android/app/src/main/assets/packs
          cp packs/*.json android/app/src/main/assets/packs/

      - name: Assemble Release & Debug APKs
        working-directory: android
        run: gradle assembleRelease assembleDebug --stacktrace

      - name: Package app-free-release.apk + SHA-256
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/release/app-release.apk release-out/app-free-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/app-debug.apk
          cd release-out
          sha256sum app-free-release.apk app-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload One-Click APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindloop-apk
          path: release-out/*

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-out/app-free-release.apk
            release-out/SHA256SUMS.txt
          generate_release_notes: true
